<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yocal</title>
<meta name="description" content="Yocal, your local guide to the River Yealm.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --ground:#F1F4F6; --card:#fff; --ink:#0E3155; --ink2:#3d5570; --teal:#0F7673; --line:#dfe5ea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  header img { width:44px; height:44px; border-radius:10px; }
  header a { color:var(--ink); text-decoration:none; font-weight:800; font-size:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  h1 { font-size:28px; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:20px; margin:28px 0 6px; }
  h3 { font-size:17px; margin:20px 0 4px; }
  a { color:var(--teal); }
  .btn { display:inline-block; background:var(--teal); color:#fff; text-decoration:none; font-weight:700; padding:12px 20px; border-radius:14px; margin-top:12px; }
  footer { margin-top:24px; font-size:14px; color:var(--ink2); display:flex; gap:18px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
<header><img src="/icon.png" alt=""><a href="/">Yocal</a></header>
<div class="card">
<h1 id="t">Page not found</h1>
<p id="p">That page isn’t here. <a href="/">Go to the Yocal home page</a>.</p>
<script>
  // A holiday let card (/h/CODE) or gym poster (/gym/...) scanned on a phone without Yocal.
  var m = location.pathname.match(/^\/(h|house)\/([A-Za-z0-9]+)/), g = /^\/gym\//.test(location.pathname);
  if (m || g) {
    document.getElementById('t').textContent = m ? 'Welcome to the Yealm' : 'Barnhouse Fitness';
    document.getElementById('p').innerHTML = 'This opens in the Yocal app. Get it free, then scan again'
      + (m ? ', or type this code in the app: <strong>' + m[2].toUpperCase() + '</strong>' : '')
      + '.<br><a class="btn" href="https://apps.apple.com/gb/app/id6811998203">Get Yocal on the App Store</a>';
  }
</script>
</div>
<footer><a href="/">Home</a><a href="/support/">Help</a><a href="/privacy/">Privacy</a><span>© Matthew Gough</span></footer>
</main>
</body>
</html>
